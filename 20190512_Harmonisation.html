# Harmonisation de la gamme majeure

&nbsp;

&nbsp;

&nbsp;

<div style="text-align: right;">Pour (surtout) ma mère</div>
<div style="text-align: right; font-size: 75%;">C.Gragnic, 12 mai 2019</div>

---

## But

* La gamme majeure est très présente dans la musique occidentale.
* De sa structure découle une série de 7 accords.
* En plus des qualités intrinsèques (majeur, mineur…), chacun a une
  « couleur » et « rôle » propres dans une tonalité.
* Ce diaporama explique la construction de ces 7 accords.
* Ces structures permettent d’organiser le travail du lien entre ces couleurs
  ou rôles à leur jeu sur l’instrument.

---

&nbsp;

    Do
     
    Ré
     
    Mi
     
    Fa
     
    Sol
     
    La
     
    Si
     
    Do

Voici la gamme majeure de Do.

---

&nbsp;

    Do
     
    Ré
     
    Mi
       )
    Fa
     
    Sol
     
    La
     
    Si
       )
    Do

Sur un piano, il n’y a pas de touche noire entre ces notes, donc pas de note
intermédiaire avec ♯ ou ♭. Sur une guitare, ces notes sont côte à côte et
l’écart entre ces notes est donc 1/2 ton.

---

&nbsp;

    Do
       )
    Ré
       )
    Mi
     
    Fa
       )
    Sol
       )
    La
       )
    Si
     
    Do

Sur un piano, il y a une touche noire entre ces notes, donc une note
intermédiaire avec ♯ ou ♭. Sur une guitare, ces notes sont séparées par une
case et l’écart entre ces notes est donc 1 ton (= 2 demi-tons).

---

&nbsp;

    Do
       ) 2
    Ré
       ) 2
    Mi
       ) 1
    Fa
       ) 2
    Sol
       ) 2
    La
       ) 2
    Si
       ) 1
    Do

Ici on a les écarts entre les notes de la gamme de Do, comptés en 1/2 tons.

---

&nbsp;

    Do      <-- on garde

    (Ré)    <-- on jette

    Mi      <-- on garde
       
    (Fa)    <-- on jette
       
    Sol     <-- on garde

Les accords se construisent en sautant une note dans la gamme.  
On part de la fondamentale, la deuxième note est la tièrce et la troisième
est la quinte.

---

&nbsp;

    Do

     4

    Mi
       
     3
       
    Sol

Voici l’accord de Do avec les écarts en 1/2 tons entre les notes.

---

&nbsp;

    Do

     4   Ré

    Mi    3
       
     3   Fa
       
    Sol   4

         La
       
Pareil pour l’accord de Ré, la tierce est Fa, la quinte est La.

---

&nbsp;

    Do

     4   Ré

    Mi    3   Mi
       
     3   Fa    3   Fa...
       
    Sol   4   Sol

         La    4

              Si

Le reste est laissé en exercice !

On obtient des accords :

* « 4+3 », dits « majeurs » (pas de lettre après dans la notation),
* « 3+4 », dits « mineurs » (un m après le nom de la note dans la notation),
* « 3+3 », dits « diminués » (très peu utilisés, on les oublie pour l’instant).

---

&nbsp;

    Do     Ré m     Mi m     Fa     Sol     La m      Si dim
    I      II m    III m     IV      V      VI m      VII dim

Voici la fameuse « harmonisation de la gamme majeure de do » !
Les notes utilisées sont à trouver parmi les notes de cette gamme.

---

On peut tout reprendre avec la gamme majeure de Sol.

On doit :

* partir de la fondamentale Sol,
* respecter les écarts 2 2 1 2 2 2 1,
* passer d’un nom de note à un autre.
